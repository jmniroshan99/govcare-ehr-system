<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <meta
      name="description"
      content="GovCare EHR System for secure government hospital electronic health records."
    />
    <link rel="icon" type="image/png" href="/ministry-health-logo.png" />
    <link rel="apple-touch-icon" href="/ministry-health-logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>GovCare EHR System</title>
  </head>
  <body>
    <div id="root">
      <main style="min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f7faf9,#e6f3ef);font-family:Inter,Segoe UI,Arial,sans-serif;color:#17201d">
        <section style="max-width:460px;border:1px solid #d8e3df;border-radius:14px;background:#fff;padding:28px;text-align:center;box-shadow:0 18px 50px rgba(15,118,110,.14)">
          <img src="/ministry-health-logo.png" alt="Ministry of Health logo" style="width:72px;height:72px;object-fit:contain;margin-bottom:12px" />
          <h1 style="margin:0;font-size:24px">GovCare EHR System</h1>
          <p style="margin:10px 0 0;color:#5f6f69;font-weight:600">Loading hospital workspace...</p>
          <p style="margin:16px 0 0;font-size:13px;color:#5f6f69">If this message stays visible, refresh the page once.</p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
